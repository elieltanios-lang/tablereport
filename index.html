<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table Report</title>
<style>
:root{color-scheme:light;--surface-0:#f5f4f1;--surface-1:#fcfcfb;--line:#e3e1dc;--line-2:#d3d1ca;
--text-1:#0b0b0b;--text-2:#52514e;--text-3:#7a7873;--accent:#2a78d6;--warn:#fab219;--chip:#eef1f6;}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--surface-0:#131312;--surface-1:#1a1a19;--line:#2e2e2c;--line-2:#3d3d3a;--text-1:#fff;--text-2:#c3c2b7;--text-3:#96958c;--accent:#3987e5;--chip:#242426;}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:8px 20px 48px}
.stamp{font-size:12.5px;color:var(--text-3);padding:10px 2px 0}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:var(--surface-0);padding:10px 0;z-index:5}
#q{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-1);color:var(--text-1);font-size:15px}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{padding:9px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-1);color:var(--text-2);font-size:13px;cursor:pointer}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#sortsel{padding:11px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-1);color:var(--text-2);font-size:14px}
.count{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tblwrap{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface-1);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);cursor:pointer;user-select:none;z-index:2;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left}
th .ar{opacity:.35;font-size:9px}
th[data-on] .ar{opacity:1;color:var(--accent)}
tbody tr:hover{background:var(--chip)}
tbody tr:last-child td{border-bottom:none}
.tname{font-weight:600}
.tmeta{display:block;font-size:11.5px;color:var(--text-3);font-weight:400}
.zero{color:var(--text-3)}
.ppl{color:var(--text-3);font-size:12.5px;font-weight:400;white-space:nowrap}
.vwrap{white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);background:var(--chip);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;cursor:help}
.flag .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
tfoot td{position:sticky;bottom:0;background:var(--surface-1);font-weight:600;border-top:2px solid var(--line-2);border-bottom:none}
.empty{padding:32px;text-align:center;color:var(--text-3)}
.linkish{font:inherit;color:var(--accent);background:none;border:none;padding:0 0 1px;border-bottom:1px dashed currentColor;cursor:pointer}
.linkish.more{display:inline-block;margin-top:5px;font-size:12.5px;border-bottom-style:dotted}
body:not(.showcols) .cdet{display:none}
.dsub{margin:10px 0 2px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.linkish[aria-expanded=true]{border-bottom-style:solid}
tr.detail td{background:var(--chip);padding:0 12px 12px;text-align:left;white-space:normal}
.dpanel{border-left:3px solid var(--line-2);padding:10px 12px;margin-top:2px}
.dpanel.warn{border-left-color:var(--warn)}
.dpanel.door{border-left-color:#b9d61d}
.dpanel.ci{border-left-color:var(--accent)}
.tag{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;color:var(--text-2);background:var(--surface-1)}
.tag.t-door{background:#DEFE40;border-color:#b9d61d;color:#0b0b0b;font-weight:600}
.tag.t-unpaid{border-color:var(--warn);color:var(--text-1)}
.dhead{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.dlist{display:grid;gap:6px}
.did{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:13.5px}
.did code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;background:#DEFE40;border:1px solid #b9d61d;border-radius:6px;padding:1px 7px;color:#0b0b0b;letter-spacing:.02em}
.did .noid{color:var(--text-3);font-style:italic}
.did .meta{color:var(--text-2)}
.did .who{color:var(--text-3);flex-basis:100%;font-size:12.5px}
.legend{margin-top:14px;font-size:12.5px;color:var(--text-3);line-height:1.7}
@media(max-width:760px){
 .wrap{padding:4px 10px 40px;max-width:100%}
 .controls{padding:10px 0 8px;gap:8px}
 #q{width:100%;flex:1 0 100%;font-size:16px;padding:13px 14px}
 .btn{flex:0 0 auto;text-align:center;padding:11px 14px;white-space:nowrap}
 .lg{display:none}
 #sortsel{display:block;flex:1 0 100%;width:100%;max-width:none}
 .count{width:100%;text-align:right}
 table,tbody,tfoot,tr,td{display:block;width:100%}
 thead{display:none}
 tbody tr{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
 tbody tr:hover{background:transparent}
 td{border:none;padding:3px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;white-space:normal;text-align:right;font-size:15px}
 td::before{content:attr(data-label);color:var(--text-3);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;flex:none}
 td:first-child{display:block;padding:0 0 8px;text-align:left}
 td:first-child::before{content:none}
 .tname{font-size:17px}
 td.mzero,td.mempty{display:none}
 tr.detail{padding:0 8px 10px}
 tr.detail td{display:block;padding:0;background:transparent}
 .did{font-size:14px}
 tfoot tr{padding:12px 14px;background:var(--chip);border-top:2px solid var(--line-2)}
 tfoot td{position:static;background:transparent;border:none}
 tfoot td:first-child{font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
}
#sortsel{max-width:260px}

const n=x=>x.toLocaleString('en-US');
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const open=new Set();
function idList(groups, word){
  return groups.map(g=>`<div class="did">
    ${g.id?`<code>${esc(g.id)}</code>`:'<span class="noid">no payment ID</span>'}
    <span class="meta">${g.seats} seat${g.seats>1?'s':''} &middot; ${m(g.amount)} ${word} &middot; ${g.checkedIn} checked in</span>
    ${g.names.length?`<span class="who">${g.names.map(esc).join(', ')}</span>`:''}
  </div>`).join('');
}
function detailRow(r,col){
  let head='', items='', tone='';
  if(col==='unpaid'){
    tone='warn';
    head=`${r.unpaidCount} unpaid seat${r.unpaidCount>1?'s':''} &middot; ${m(r.unpaidAmt)} outstanding`;
    items=idList(r.unpaidDetail,'due');
  } else {
    tone='ci';
    head=`${r.checkedIn} checked in of ${r.invited} invited &middot; ${m(r.lineTotal)} paid`;
    items=r.ciDetail.map(b=>`<div class="did">
      <span class="tag t-${b.st}">${b.label}</span>
      <span class="meta">${b.seats} seat${b.seats>1?'s':''} &middot; ${m(b.amount)}</span>
      ${(b.names.length||b.anon)?`<span class="who">${[...b.names.map(esc), b.anon?`${b.anon} anonymous`:''].filter(Boolean).join(', ')}</span>`:''}
    </div>`).join('');
    if(r.doorDetail.length) items+=`<div class="dsub">Door payments &middot; ${r.doorCount} seat${r.doorCount>1?'s':''} &middot; ${m(r.doorAmt)}</div>`+idList(r.doorDetail,'collected');
  }
  return `<tr class="detail"><td colspan="7"><div class="dpanel ${tone}">
    <div class="dhead">${head}</div><div class="dlist">${items}</div></div></td></tr>`;
}
const key=(n,c)=>n+'\u0000'+c;
function cellBtn(r,col,val){
  return `<button class="linkish" data-t="${esc(r.name)}" data-c="${col}" aria-expanded="${open.has(key(r.name,col))}">${val}</button>`;
}
const m=x=>'$'+x.toLocaleString('en-US');
let sortK='name', sortDir=1, onlyDoor=false;
const body=document.getElementById('body'), foot=document.getElementById('foot'), cnt=document.getElementById('count'), empty=document.getElementById('empty');
function view(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let rows=DATA.filter(r=>{
    if(onlyDoor&&r.doorCount===0) return false;
    if(!q) return true;
    return (r.name+' '+r.area+' '+r.ticket+' '+r.ptype).toLowerCase().includes(q);
  });
  rows.sort((a,b)=>{
    let x=a[sortK],y=b[sortK];
    if(sortK==='name') return sortDir*(a._k<b._k?-1:a._k>b._k?1:0);
    return sortDir*((x-y)||(a._k<b._k?-1:1));
  });
  body.innerHTML=rows.map(r=>`<tr>
   <td><span class="tname">${r.name}</span><span class="tmeta">${r.area} &middot; ${r.ticket}${r.ptype==='Free'?' &middot; Free':''}</span>
       <button class="linkish more" data-t="${esc(r.name)}" data-c="details" aria-expanded="${open.has(key(r.name,'details'))}">${open.has(key(r.name,'details'))?'Hide details':'Details'}</button></td>
   <td data-label="Checked in" class="cdet">${r.checkedIn||'<span class=zero>0</span>'}</td>
   <td data-label="Paid at door" class="cdet ${r.doorCount?'':'mzero'}">${r.doorCount||'<span class=zero>0</span>'}</td>
   <td data-label="Door $" class="cdet ${r.doorAmt?'':'mzero'}">${r.doorAmt?m(r.doorAmt):'<span class=zero>&mdash;</span>'}</td>
   <td data-label="Deposit $" class="cdet ${r.depAmt?'':'mzero'}">${r.depAmt?m(r.depAmt):'<span class=zero>&mdash;</span>'}</td>
   <td data-label="Total paid">${r.lineTotal?`<span class="vwrap">${m(r.lineTotal)} <span class="ppl">${n(r.linePaid)} ppl</span></span>`:'<span class=zero>$0</span>'}</td>
   <td data-label="Not paid" class="${r.unpaidCount?'':'mzero'}">${r.unpaidCount?cellBtn(r,'unpaid',r.unpaidCount):'<span class=zero>0</span>'}</td>
  </tr>${['details','unpaid'].filter(c=>open.has(key(r.name,c))).map(c=>detailRow(r,c)).join('')}`).join('');
  const s=k=>rows.reduce((a,r)=>a+r[k],0);
  foot.innerHTML=`<td>${rows.length===DATA.length?'All '+n(rows.length)+' tables':n(rows.length)+' shown'}</td>
   <td data-label="Checked in" class="cdet">${n(s('checkedIn'))}</td><td data-label="Paid at door" class="cdet">${n(s('doorCount'))}</td>
   <td data-label="Door $" class="cdet">${m(s('doorAmt'))}</td><td data-label="Deposit $" class="cdet">${m(s('depAmt'))}</td>
   <td data-label="Total paid"><span class="vwrap">${m(s('lineTotal'))} <span class="ppl">${n(s('linePaid'))} ppl</span></span></td><td data-label="Not paid">${n(s('unpaidCount'))}</td>`;
  cnt.textContent=`${rows.length} of ${DATA.length} tables`;
  empty.hidden=rows.length>0;
}
DATA.forEach(r=>{const mm=/^([A-Za-z]+)\s*0*(\d+)?(.*)$/.exec(r.name);r._k=mm?mm[1].toUpperCase()+String(mm[2]?+mm[2]:-1).padStart(5,'0')+(mm[3]||''):r.name.toUpperCase();});
body.addEventListener('click',e=>{
  const b=e.target.closest('.linkish'); if(!b) return;
  const k=key(b.dataset.t,b.dataset.c);
  if(open.has(k)) open.delete(k); else open.add(k);
  view();
});
document.getElementById('q').addEventListener('input',view);
document.getElementById('cols').addEventListener('click',e=>{
  const on=document.body.classList.toggle('showcols');
  e.currentTarget.setAttribute('aria-pressed',on);
});
document.getElementById('sortsel').addEventListener('change',e=>{sortK=e.target.value;sortDir=(sortK==='name')?1:-1;view();});
document.getElementById('onlyDoor').addEventListener('click',e=>{onlyDoor=!onlyDoor;e.currentTarget.setAttribute('aria-pressed',onlyDoor);view();});
document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;
  if(sortK===k) sortDir*=-1; else {sortK=k; sortDir=(k==='name')?1:-1;}
  document.querySelectorAll('th[data-k]').forEach(t=>{t.removeAttribute('data-on');t.querySelector('.ar').innerHTML='&#9650;';});
  th.setAttribute('data-on','1'); th.querySelector('.ar').innerHTML=sortDir===1?'&#9650;':'&#9660;';
  view();
}));
document.querySelector('th[data-k=name]').setAttribute('data-on','1');
view();
</script></body></html>
